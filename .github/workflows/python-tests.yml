name: Python regression tests
on:
  push:
    branches: [raspi-robustness, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "paho-mqtt>=2,<3" "pyserial>=3.5,<4"
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
